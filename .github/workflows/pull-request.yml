name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          SITE_URL: https://pr-${{ github.event.pull_request.number || 'manual' }}.kaogong-assistant.pages.dev
          BASE_PATH: /
          CLEAN_URLS: "true"
          PREVIEW: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: docs/.vitepress/dist
          retention-days: 7

  preview:
    name: Deploy preview
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-site
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy isolated preview
        run: npx -y wrangler@3 pages deploy dist --project-name kaogong-assistant --branch "$PREVIEW_BRANCH"
        env:
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Show preview link
        run: echo "Preview URL -- https://${PREVIEW_BRANCH}.kaogong-assistant.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
        env:
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
